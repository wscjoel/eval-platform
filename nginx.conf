# 客服AI评测台 — Nginx 配置
# 部署方式：Nginx 反向代理 → uvicorn/FastAPI (127.0.0.1:8000)
#
# 使用方法：
#   sudo cp nginx.conf /etc/nginx/sites-available/eval-platform
#   sudo ln -s /etc/nginx/sites-available/eval-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 如需 HTTPS，取消注释 SSL 部分，并将证书路径替换为实际路径。

upstream eval_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS 跳转（启用 SSL 时取消注释）
# server {
#     listen 80;
#     server_name eval.example.jd.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;          # 启用 SSL 时替换上方 listen 80
    server_name eval.example.jd.com; # ← 替换为实际域名或内网 IP

    # ----- SSL 证书（启用 HTTPS 时取消注释）-----
    # ssl_certificate     /etc/nginx/ssl/eval.crt;
    # ssl_certificate_key /etc/nginx/ssl/eval.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ----- 基础设置 -----
    charset utf-8;
    # 请求体上限：需 ≥ 后端 EVAL_MAX_FILE_MB（默认 50M），同时给大 JSON（PUT /datasets/replace、
    # POST /datasets/from-cleaning、大 prompt schema）留余量。线上若仍 413，请检查是否被外层
    # http{} 全局指令、WAF / SLB / Ingress 覆盖。
    client_max_body_size 200M;
    client_body_buffer_size 1m;
    # 上传走流式，关闭请求缓冲，避免 nginx 把大 body 先写盘
    proxy_request_buffering off;

    # ----- Gzip 压缩 -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # ----- 访问日志 -----
    access_log /var/log/nginx/eval-platform.access.log;
    error_log  /var/log/nginx/eval-platform.error.log warn;

    # ----- /api/* → FastAPI 后端 -----
    location /api/ {
        proxy_pass         http://eval_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 评测任务接口耗时较长，适当放宽超时
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ----- /docs /redoc /openapi.json → FastAPI 文档 -----
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://eval_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection      "";
    }

    # ----- 前端静态资源（Vite 构建产物带 hash，长缓存）-----
    location /assets/ {
        proxy_pass         http://eval_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   Connection      "";

        # Vite 构建文件名含 hash，可安全设置长缓存
        proxy_cache_valid  200 30d;
        add_header         Cache-Control "public, max-age=2592000, immutable";
    }

    # ----- SPA 入口及其他路由 → FastAPI（FastAPI 已处理 SPA fallback）-----
    location / {
        proxy_pass         http://eval_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # HTML 不缓存，保证 SPA 版本及时更新
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----- 安全响应头 -----
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
